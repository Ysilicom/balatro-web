:root{--cream:#f5f0df;--ink:#263c43;--panel:#3f5158;--panel-dark:#25383f;--edge:#697d7f;--blue:#19a4dd;--red:#f45651;--gold:#f0ba57;--green:#73b5a1;--scale:1;--pixel:"DeckPixel","Courier New",monospace;--text:"DeckPixel","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#213f40;color:var(--cream)}body,button,input{font-family:var(--text);font-weight:400}button,input{-webkit-tap-highlight-color:transparent}button{color:inherit;font-size:inherit;cursor:pointer}button:disabled{cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid #f0cf7b;outline-offset:5px}button img{pointer-events:none}button{user-select:none}img{image-rendering:pixelated;image-rendering:crisp-edges}b,strong{font-weight:400}button,p,h1,h2,h3{margin:0}input{color:var(--cream)}[hidden]{display:none!important}
#background{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}.screen-grain{position:fixed;inset:0;pointer-events:none;z-index:30;opacity:.10;background:repeating-linear-gradient(0deg,rgba(0,0,0,.38) 0px,rgba(0,0,0,.38) 1px,transparent 1px,transparent 3px);mix-blend-mode:multiply}.screen-vignette{position:fixed;inset:0;pointer-events:none;z-index:31;box-shadow:inset 0 0 180px 50px rgba(8,16,23,.47);border-radius:1.4vw}.no-crt .screen-grain,.no-crt .screen-vignette{display:none}
#viewport{position:absolute;inset:0;overflow:hidden}#scene{width:var(--scene-width,1440px);height:900px;position:absolute;left:50%;top:50%;padding:22px 32px 12px;transform:translate(-50%,-50%) scale(var(--scale));transform-origin:center;isolation:isolate;transition:width .15s}
#scene.fill-mode{transform:translate(-50%,-50%) scale(var(--scale-x),var(--scale-y))!important}
.icon-button{display:inline-flex;align-items:center;justify-content:center;line-height:1}
.icon-button svg{pointer-events:none}
#topbar{height:64px;display:flex;justify-content:space-between;align-items:center;padding:0 5px 12px 0}
.brand{display:flex;align-items:center;gap:1px;background:none;border:0;text-shadow:3px 5px 0 #a3484d,5px 7px 0 #183d46;position:relative;line-height:1;font-family:var(--pixel);font-size:45px;letter-spacing:-1px;padding:0 8px 8px 0}
.brand>span{display:inline-block;transform:rotate(-6deg)}.brand>span:nth-child(2n){transform:rotate(3deg) translateY(2px)}.brand>span:nth-child(3n){transform:rotate(-3deg) translateY(-1px)}.brand>i{font-style:normal;font-size:11px;letter-spacing:2px;position:absolute;left:5px;bottom:-2px;text-shadow:1px 2px #183a42;opacity:.74}
.top-right{display:flex;gap:18px;align-items:center;font-size:14px;color:#dbdfcc;text-shadow:1px 2px #254044}.stake-indicator,#save-status{display:flex;gap:8px;align-items:center}.stake-indicator i{width:12px;height:12px;background:#ece8d5;border-radius:50%;border:2px solid #a5b4af;box-shadow:0 2px #203940}.top-right #save-status{font-size:12px;opacity:.67}.top-right #save-status i{width:5px;height:5px;border-radius:50%;background:#a2ceaa}.top-button,.icon-button{height:34px;border:1px solid #658680;background:rgba(41,66,68,.5);box-shadow:0 3px 0 #203a40;border-radius:6px;text-shadow:1px 2px #20373e}.top-button{padding:0 15px;min-width:116px}.top-button span{margin-left:12px;color:#b4ccbe}.icon-button{width:37px;font-size:23px}.top-button:hover,.icon-button:hover{background:#55716e}
#board{display:grid;grid-template-columns:244px 1fr;gap:27px;height:764px}
#sidebar{height:100%;background:linear-gradient(90deg,#3b4d53,#41535a);border:2px solid #637777;border-radius:12px;padding:12px;box-shadow:0 5px 0 #20363d,0 0 0 4px rgba(31,52,57,.20);position:relative;display:flex;flex-direction:column;gap:10px;text-shadow:1px 2px #263b43}
#blind-summary{min-height:162px;border:2px solid #263b40;box-shadow:0 3px #25363d;border-radius:8px;overflow:hidden;background:#2a4047}
.blind-banner{height:33px;display:flex;align-items:center;justify-content:center;font-size:19px;text-shadow:1px 2px rgba(30,40,50,.55);border-bottom:3px solid rgba(0,0,0,.15);background:var(--blind-color,#5392a0)}
.blind-main{display:flex;align-items:center;gap:9px;padding:11px 7px 2px}.blind-main img{width:60px;height:62px;filter:drop-shadow(0 3px 0 #1f343c)}.blind-target{flex:1;text-align:center}.blind-target>span{font-size:13px;color:#e2e6d9;display:block}.blind-target>strong{display:block;font-size:33px;color:var(--red);line-height:1.1;margin-top:4px;white-space:nowrap}.blind-target>strong small{font-size:19px;color:#c5d9d5;vertical-align:3px;margin-right:4px}.blind-reward{text-align:center;font-size:12px;color:#c4d0c8;padding:4px 0 7px}.blind-reward b{font-size:18px;color:var(--gold);letter-spacing:1px}.blind-rule{padding:0 7px 7px;text-align:center;font-size:12px;line-height:1.5;color:#e0d4d0}
.score-heading{font-size:14px;display:flex;justify-content:space-between;align-items:center;margin-top:0;color:#e1e6da}.score-heading span{font-size:9px;letter-spacing:.5px;color:#8da4a3}
.round-score{height:52px;min-height:52px;background:#283e45;border-radius:6px;box-shadow:inset 0 3px #22373e;display:flex;justify-content:center;gap:10px;align-items:center;font-size:37px;text-shadow:2px 3px #192f38;line-height:1}.round-score .chip-glyph{color:#b9d1cd;font-size:26px}.round-score strong{max-width:168px;overflow:hidden;font-size:39px}
.progress-track{height:5px;min-height:5px;background:#263e42;border-radius:4px;margin:-4px 1px 0;overflow:hidden}.progress-track div{height:100%;width:0;background:#8abdae;transition:width .45s}
.hand-preview{background:#223940;border:2px solid #1c3239;border-radius:8px;padding:10px 7px 9px;box-shadow:0 3px #1b3037;min-height:126px}.hand-name-row{display:flex;justify-content:center;align-items:center;gap:8px;height:28px;white-space:nowrap}.hand-name-row strong{font-size:23px}.hand-name-row span{font-size:14px;color:#dfbc60}.hand-preview #hand-en{font-size:11px;text-align:center;color:#95a7a4;margin:3px 0 9px;min-height:11px}.score-formula{display:flex;align-items:center;gap:5px;font-size:34px;line-height:1;text-shadow:2px 3px rgba(0,0,0,.23)}.score-formula>div{width:84px;height:47px;display:grid;place-items:center;border-radius:6px;box-shadow:inset 0 2px rgba(255,255,255,.1),0 3px rgba(0,0,0,.3)}#chips-value{background:#139fd7}#mult-value{background:#ef5653}.score-formula>span{color:#f56b5f;font-size:29px}
.resource-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.resource{height:68px;display:flex;align-items:center;flex-direction:column;justify-content:center;background:#31454e;border:2px solid #6c7d8e;box-shadow:0 2px #233841;border-radius:8px;padding:3px}.resource>span{font-size:14px;line-height:1.2}.resource strong{font-size:37px;line-height:1}.resource small{font-size:17px;color:#e7e0c4;margin-left:4px}.resource>div{display:flex;align-items:baseline}.resource-grid.lower .resource{height:66px}
.chips{color:#23b1ee!important}.mult{color:#f66b64!important}.money{color:#f5c463!important}.xmult{color:#f76961!important;background:#4c3234;padding:1px 4px;border-radius:3px}.hearts{color:#f57180}.diamonds{color:#ffa274}.clubs{color:#81c3a5}
.money-box{height:62px;min-height:62px;background:#30454d;border:2px solid #6c7d8e;box-shadow:0 2px #233841;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:10px}.money-box strong{font-size:39px;color:#f2be60;line-height:1}.money-box span{font-size:11px;color:#94aaa6;max-width:26px;line-height:1.4}
.btn{border:0;border-top:2px solid rgba(255,255,255,.2);border-bottom:2px solid rgba(0,0,0,.1);border-radius:8px;box-shadow:0 5px 0 var(--button-shadow,#25404a),0 5px 0 2px rgba(20,36,44,.35);text-shadow:2px 2px 0 rgba(30,36,43,.38);font-size:21px;line-height:1;background:#708488;min-height:48px;padding:9px 21px;transition:transform .10s,filter .10s,box-shadow .10s;white-space:nowrap;position:relative}.btn:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-2px)}.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--button-shadow,#25404a),0 1px 0 2px rgba(20,36,44,.35)}.btn:disabled{filter:saturate(.3);opacity:.45}.btn.blue{background:#179ed6;--button-shadow:#096387}.btn.red{background:#ed5851;--button-shadow:#9b3539}.btn.amber{background:#dea536;--button-shadow:#947125}.btn.green{background:#589c86;--button-shadow:#326753}.btn.muted{background:#5b7177;--button-shadow:#354b54}.btn.purple{background:#a282b4;--button-shadow:#645377}.btn.small{min-height:36px;padding:6px 16px;font-size:16px}.btn kbd{margin-left:15px;background:rgba(23,51,62,.24);color:rgba(255,255,240,.75);text-shadow:none;border:0;font-size:12px;padding:4px 6px;border-radius:4px;vertical-align:2px}.btn.info-button{min-height:45px;font-size:16px;margin-top:1px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}.info-button>span{font-size:20px}.deck-caption{font-size:11px;color:#a2b3ab;text-align:center;line-height:1.5;margin-top:auto}

 if(s.phase!=='play')return '当前不能出牌';
 if(!s.selected.length)return '先选择 1–5 张牌';
 if(s.selected.some(id=>!s.hand.includes(id)))return '所选牌不在手中';
 if(s.selected.length>5)return '最多选择 5 张牌';
 const ev=E.evaluate(E.cards(s,s.selected),E.flags(s)),b=s.blind.key;
 if(b==='psychic'&&s.selected.length!==5)return '灵媒：必须打出 5 张牌';
 if(b==='eye'&&s.roundUses[ev.key])return '眼睛：本回合已经使用过该牌型';
 if(b==='mouth'&&s.firstType&&s.firstType!==ev.key)return '嘴：本回合只能打出 '+D.hand(s.firstType).name;
 if(s.forced&&!s.selected.includes(s.forced))return '必须打出被蔚蓝之铃选中的牌';
 return null;
};
E.resolvedJokers=function(s){
 return s.jokers.map((j,i)=>{
  let k=j,index=i,seen=new Set();
  while(k&&(k.key==='blueprint'||k.key==='brainstorm')){
   if(seen.has(index))return {source:j,effect:null};seen.add(index);
   index=k.key==='blueprint'?index+1:0;k=s.jokers[index];
  }
  return {source:j,effect:k||null};
 });
};
/* Each score is an ordered list of operations, allowing deterministic playback in the UI. */
E.score=function(s,cards,preview=false){
 if(preview)s=clone(s);
 const ev=E.evaluate(cards,E.flags(s)),steps=[],destroy=[],scoring=ev.scoring;
 if(s.blind.key==='arm')s.levels[ev.key]=Math.max(1,s.levels[ev.key]-1);
 let base=E.handValue(s,ev.key);
 if(s.blind.key==='flint')base={...base,chips:Math.max(1,Math.round(base.chips/2)),mult:Math.max(1,Math.round(base.mult/2))};
 let chips=base.chips,mult=base.mult,photoUsed=new Set();
 const op=(kind,value,label,target,id)=>{
  if(value===0)return;
  if(kind==='chips')chips+=value;else if(kind==='mult')mult+=value;else if(kind==='xmult')mult*=value;else if(kind==='money')s.money+=value;
  steps.push({kind,value,label,target,id,chips,mult});
 };
 s.uses[ev.key]=(s.uses[ev.key]||0)+1;
 const repeated=!!s.roundUses[ev.key];s.roundUses[ev.key]=(s.roundUses[ev.key]||0)+1;
 s.firstType??=ev.key;
 if(!s.seenHands.includes(ev.key))s.seenHands.push(ev.key);
 for(const j of s.jokers){
  if(j.key==='green')j.value++;
  if(j.key==='bus')j.value=scoring.some(c=>E.isFace(c)&&!E.isDebuffed(s,c))?0:j.value+1;
  if(j.key==='trousers'&&ev.contains.two)j.value+=2;
  if(j.key==='square'&&cards.length===4)j.value+=4;
 }
 if(s.blind.key==='tooth')op('money',-cards.length,'牙齿','blind',null);
 const resolved=E.resolvedJokers(s);
 for(let i=0;i<scoring.length;i++){
  const c=scoring[i];
  if(E.isDebuffed(s,c)){steps.push({kind:'debuff',label:'失效',target:'card',id:c.id,chips,mult});continue;}
  let repeats=1+(c.seal==='red'?1:0);
  for(const {effect:j} of resolved){
   if(!j)continue;
   if(j.key==='chad'&&i===0)repeats+=2;
   if(j.key==='sock'&&E.isFace(c))repeats++;
   if(j.key==='hack'&&[2,3,4,5].includes(c.rank)&&c.enhancement!=='stone')repeats++;
  }
  for(let r=0;r<repeats;r++){
   if(r)steps.push({kind:'again',label:'再次触发！',target:'card',id:c.id,chips,mult});
   op('chips',E.cardChips(c),'牌面筹码','card',c.id);
   if(c.enhancement==='stone')op('chips',50,'石头牌','card',c.id);
   if(c.enhancement==='bonus')op('chips',30,'奖励牌','card',c.id);
   if(c.enhancement==='mult')op('mult',4,'倍率牌','card',c.id);
   if(c.enhancement==='glass')op('xmult',2,'玻璃牌','card',c.id);
   if(c.enhancement==='lucky'){
    if(E.random(s)<.2)op('mult',20,'幸运！','card',c.id);
    if(E.random(s)<1/15)op('money',20,'大吉！','card',c.id);
   }
   if(c.edition==='foil')op('chips',50,'闪箔','card',c.id);
   if(c.edition==='holo')op('mult',10,'镭射','card',c.id);
   if(c.edition==='poly')op('xmult',1.5,'多彩','card',c.id);
   if(c.seal==='gold')op('money',3,'金色蜡封','card',c.id);
   for(const {source,effect:j} of resolved){
    if(!j)continue;const k=j.key,n=D.joker(k).name,id=source.uid,isBase=c.enhancement!=='stone';
    const suitMap={greedy:'D',lusty:'H',wrathful:'S',gluttonous:'C'};
    if(suitMap[k]&&E.isSuit(c,suitMap[k]))op('mult',3,n,'joker',id);
    if(k==='fibonacci'&&isBase&&[14,2,3,5,8].includes(c.rank))op('mult',8,n,'joker',id);
    if(k==='even'&&isBase&&[2,4,6,8,10].includes(c.rank))op('mult',4,n,'joker',id);
    if(k==='odd'&&isBase&&[14,3,5,7,9].includes(c.rank))op('chips',31,n,'joker',id);
    if(k==='scholar'&&isBase&&c.rank===14){op('chips',20,n,'joker',id);op('mult',4,n,'joker',id);}
    if(k==='scary'&&E.isFace(c))op('chips',30,n,'joker',id);
    if(k==='smiley'&&E.isFace(c))op('mult',5,n,'joker',id);
    if(k==='photograph'&&E.isFace(c)){
     const first=scoring.find(x=>E.isFace(x)&&!E.isDebuffed(s,x));
     if(first&&first.id===c.id)op('xmult',2,n,'joker',id);
    }
   }
  }
  if(c.enhancement==='glass'&&E.random(s)<.25)destroy.push(c.id);
 }
 const held=E.cards(s,s.hand.filter(id=>!cards.some(c=>c.id===id)));
 for(const c of held){
  if(E.isDebuffed(s,c))continue;
  if(c.enhancement==='steel')for(let n=0;n<(c.seal==='red'?2:1);n++)op('xmult',1.5,'钢铁牌','held',c.id);
 }
 for(const {source,effect:j} of resolved){
  if(j){
   const k=j.key,n=D.joker(k).name,id=source.uid;
   const add=(type,v)=>op(type,v,n,'joker',id);
   if(k==='joker')add('mult',4);
   if(k==='jolly'&&ev.contains.pair)add('mult',8);
   if(k==='zany'&&ev.contains.three)add('mult',12);
   if(k==='mad'&&ev.contains.two)add('mult',10);
   if(k==='crazy'&&ev.contains.straight)add('mult',12);
   if(k==='droll'&&ev.contains.flush)add('mult',10);
   if(k==='sly'&&ev.contains.pair)add('chips',50);
   if(k==='wily'&&ev.contains.three)add('chips',100);
   if(k==='clever'&&ev.contains.two)add('chips',80);
   if(k==='half'&&cards.length<=3)add('mult',20);
   if(k==='banner')add('chips',s.discards*30);
   if(k==='summit'&&s.discards===0)add('mult',15);
   if(k==='abstract')add('mult',s.jokers.length*3);
   if(k==='blackboard'&&held.every(c=>E.isSuit(c,'S')||E.isSuit(c,'C')))add('xmult',3);
   if(['green','bus','trousers','popcorn'].includes(k))add('mult',Math.max(0,j.value));
   if(k==='supernova')add('mult',s.uses[ev.key]);
   if(k==='square'||k==='icecream')add('chips',j.value);
   if(k==='cardsharp'&&repeated)add('xmult',3);
   if(k==='stuntman')add('chips',250);
   if(k==='banana')add('mult',15);
   if(k==='cavendish')add('xmult',3);
   if(k==='ramen')add('xmult',j.value);
   if(k==='bull')add('chips',Math.max(0,s.money)*2);
   if(k==='bootstraps')add('mult',Math.floor(Math.max(0,s.money)/5)*2);
  }
  if(source.edition==='foil')op('chips',50,'闪箔','joker',source.uid);
  if(source.edition==='holo')op('mult',10,'镭射','joker',source.uid);
  if(source.edition==='poly')op('xmult',1.5,'多彩','joker',source.uid);
 }
 if(s.deckType==='plasma'){const v=(chips+mult)/2;chips=v;mult=v;steps.push({kind:'balance',label:'平衡！',chips,mult,target:'score'});}
 const total=Math.max(0,Math.floor(chips*mult));
 for(const j of s.jokers)if(j.key==='icecream')j.value-=5;
 s.jokers=s.jokers.filter(j=>j.key!=='icecream'||j.value>0);
 return {key:ev.key,royal:ev.royal,base,steps,chips,mult,total,scoring:scoring.map(c=>c.id),destroy,cards:clone(cards)};
};
E.play=function(s){
 const err=E.validatePlay(s);if(err)return {error:err};
 const ids=s.hand.filter(id=>s.selected.includes(id)),cards=E.cards(s,ids);
 const result=E.score(s,cards);
 s.hand=s.hand.filter(id=>!ids.includes(id));s.selected=[];s.forced=null;s.hands--;
 s.stats.hands++;s.stats.playedCards+=cards.length;s.stats.best=Math.max(s.stats.best,result.total);
 s.score+=result.total;s.discarded.push(...ids);s.lastScore=result;
 if(result.destroy.length){s.deck=s.deck.filter(c=>!result.destroy.includes(c.id));s.discarded=s.discarded.filter(id=>!result.destroy.includes(id));}
 if(s.blind.key==='hook'&&s.hand.length){const drop=E.shuffle(s,s.hand).slice(0,2);s.hand=s.hand.filter(id=>!drop.includes(id));s.discarded.push(...drop);}
 s.history.unshift({type:'hand',key:result.key,score:result.total,round:s.round});s.history=s.history.slice(0,60);
 if(s.score>=s.blind.target){s.phase='reward';E.endRound(s);}
 else if(s.hands<=0){s.phase='gameover';}
 else {E.drawCards(s,s.blind.key==='serpent'?3:Math.max(0,E.handSize(s)-s.hand.length));if(!s.hand.length)s.phase='gameover';}
 return result;
};
E.discard=function(s){
 if(s.phase!=='play'||s.discards<=0||!s.selected.length)return {error:'没有可用的弃牌机会'};
 const ids=s.selected.slice(),cards=E.cards(s,ids);s.hand=s.hand.filter(id=>!ids.includes(id));s.discarded.push(...ids);s.selected=[];s.forced=null;s.discards--;s.stats.discards++;
 for(const j of s.jokers){if(j.key==='green')j.value=Math.max(0,j.value-1);if(j.key==='ramen')j.value=Math.max(1,Math.round((j.value-ids.length*.01)*100)/100);}
 s.jokers=s.jokers.filter(j=>j.key!=='ramen'||j.value>1);
 for(const c of cards)if(c.seal==='purple'&&!E.isDebuffed(s,c)&&s.consumables.length<E.consumeSlots(s))s.consumables.push(E.newConsumable(s,'tarot',E.pick(s,D.TAROTS).id));
 E.drawCards(s,s.blind.key==='serpent'?3:Math.max(0,E.handSize(s)-s.hand.length));
 if(!s.hand.length)s.phase='gameover';return {cards};
};
E.sellValue=j=>Math.max(1,Math.floor((D.joker(j.key)?.cost||3)/2))+(j.extraSell||0)+(j.edition?1:0);
E.endRound=function(s){
 const ledger=[],add=(name,value)=>{if(value)ledger.push({name,value});};
 add('盲注奖励',s.blind.reward);
 add('剩余出牌 × '+(s.deckType==='green'?'$2':'$1'),s.hands*(s.deckType==='green'?2:1));
 if(s.deckType==='green')add('剩余弃牌 × $1',s.discards);
 else add('利息 · 每 $5 获得 $1',Math.min(s.vouchers.includes('seedmoney')?10:5,Math.floor(Math.max(0,s.money)/5)));
 for(const c of E.cards(s,s.hand)){
  if(E.isDebuffed(s,c))continue;
  if(c.enhancement==='gold')add('黄金牌',3*(c.seal==='red'?2:1));
  if(c.seal==='blue'&&s.consumables.length<E.consumeSlots(s)&&s.lastScore)s.consumables.push(E.newConsumable(s,'planet',s.lastScore.key));
 }
 const gone=[];
 for(const j of s.jokers){
  if(j.key==='golden')add('黄金小丑',4);
  if(j.key==='egg')j.extraSell+=3;
  if(j.key==='rocket'){if(s.blindIndex===2)j.value+=2;add('火箭',j.value);}
  if(j.key==='cloud9')add('九霄云外',s.deck.filter(c=>c.rank===9).length);
  if(j.key==='popcorn'){j.value-=4;if(j.value<=0)gone.push(j.uid);}
  if(j.key==='banana'&&E.random(s)<1/6){gone.push(j.uid);s.unlockedCavendish=true;}
  if(j.key==='cavendish'&&E.random(s)<.001)gone.push(j.uid);
 }
 s.jokers=s.jokers.filter(j=>!gone.includes(j.uid));
 if(s.blindIndex===2){
  for(const tag of s.pendingTags)if(tag==='investment')add('投资标签',25);
  s.pendingTags=s.pendingTags.filter(t=>t!=='investment');

};
E.nextBlind=function(s){
 s.hand=[];s.selected=[];s.forced=null;s.blindIndex++;
 if(s.blindIndex>2){s.blindIndex=0;s.ante++;E.makeBoss(s);s.anteVoucherBought=false;}
 s.blind=null;s.phase='select';
};
E.skip=function(s){
 if(s.phase!=='select'||s.blindIndex===2)return {error:'不能跳过此盲注'};
 const tag=s.tags[s.blindIndex];
 if(tag==='economy')s.money+=Math.min(40,Math.max(0,s.money));
 else if(tag==='handy')s.money+=s.stats.hands;
 else s.pendingTags.push(tag);
 E.nextBlind(s);return {tag};

E.price=(s,cost)=>Math.max(1,Math.floor(cost*(s.vouchers.includes('clearance')?.75:1)));
E.randomEdition=function(s){const r=E.random(s)*(s.vouchers.includes('hone')?.5:1);return r<.01?'negative':r<.025?'poly':r<.05?'holo':r<.08?'foil':null;};
E.randomJoker=function(s,rarity=null){
 if(!rarity){const r=E.random(s);rarity=r<.05?'rare':r<.30?'uncommon':'common';}
 let pool=D.JOKERS.filter(j=>j.rarity===rarity&&(j.id!=='cavendish'||s.unlockedCavendish)&&!s.jokers.some(x=>x.key===j.id));
 if(!pool.length)pool=D.JOKERS.filter(j=>j.rarity===rarity);
 return E.newJoker(s,E.pick(s,pool).id,E.randomEdition(s));
};
E.shopItem=function(s,first=false){
 if(first||E.random(s)<.70){const j=E.randomJoker(s);return {type:'joker',uid:E.uid(s),joker:j,cost:E.price(s,D.joker(j.key).cost+(j.edition==='poly'?5:j.edition?3:0))};}
 const planet=E.random(s)<.55;return {type:planet?'planet':'tarot',uid:E.uid(s),key:E.pick(s,planet?D.HANDS.filter(h=>D.HANDS.indexOf(h)<9||s.seenHands.includes(h.id)):D.TAROTS).id,cost:E.price(s,3)};

E.packOffer=function(s,type=null){
 type=type||E.pick(s,['buffoon','arcana','celestial','standard']);
 const r=E.random(s),size=r<.15?'mega':r<.4?'jumbo':'normal';
 return {type:'pack',packType:type,size,uid:E.uid(s),cost:E.price(s,size==='mega'?8:size==='jumbo'?6:4)};
};
E.openShop=function(s){
 s.phase='shop';s.selected=[];s.hand=[];s.forced=null;
 const count=2+(s.vouchers.includes('overstock')?1:0);
 s.shop={items:Array.from({length:count},(_,i)=>E.shopItem(s,i===0)),packs:[E.packOffer(s),E.packOffer(s)],reroll:5,voucher:null};
 if(s.round===1&&!s.jokers.length)s.shop.items[0]={type:'joker',uid:E.uid(s),joker:E.newJoker(s,'joker'),cost:E.price(s,2)};
 const vouchers=D.VOUCHERS.filter(v=>!s.vouchers.includes(v.id)&&(!v.requires||s.vouchers.includes(v.requires)));
 if(!s.anteVoucherBought&&vouchers.length){const v=E.pick(s,vouchers);s.shop.voucher={...v,cost:E.price(s,10),uid:E.uid(s)};}
 for(const tag of s.pendingTags){
  if(tag==='uncommon')s.shop.items.push({type:'joker',uid:E.uid(s),joker:E.randomJoker(s,'uncommon'),cost:0});
  if(tag==='buffoon')s.shop.packs.push({...E.packOffer(s,'buffoon'),cost:0});

E.cashOut=function(s){
 if(s.phase!=='reward')return false;s.money+=s.reward.total;s.stats.earned+=s.reward.total;
 if(s.ante===8&&s.blindIndex===2&&!s.endless){s.phase='victory';return true;}

E.reroll=function(s){
 if(s.phase!=='shop'||s.money<s.shop.reroll)return false;
 s.money-=s.shop.reroll;s.shop.reroll++;
 s.shop.items=Array.from({length:2+(s.vouchers.includes('overstock')?1:0)},()=>E.shopItem(s));return true;

E.canAddJoker=(s,j)=>s.jokers.length<E.jokerSlots(s)+(j.edition==='negative'?1:0);
E.addJoker=function(s,j){if(!E.canAddJoker(s,j))return false;s.jokers.push(j);if(!s.seenJokers.includes(j.key))s.seenJokers.push(j.key);return true;};
E.buy=function(s,uid){
 if(s.phase!=='shop')return {error:'不在商店中'};
 let item=s.shop.items.find(i=>i.uid===uid)||s.shop.packs.find(i=>i.uid===uid)||(s.shop.voucher?.uid===uid?s.shop.voucher:null);
 if(!item)return {error:'商品已售出'};if(s.money<item.cost)return {error:'金钱不足'};
 if(item.type==='joker'&&!E.canAddJoker(s,item.joker))return {error:'小丑牌槽位已满，请先出售一张'};
 if(['tarot','planet'].includes(item.type)&&s.consumables.length>=E.consumeSlots(s))return {error:'消耗牌槽位已满'};
 s.money-=item.cost;
 if(item.type==='joker')E.addJoker(s,item.joker);
 if(['tarot','planet'].includes(item.type))s.consumables.push(E.newConsumable(s,item.type,item.key));
 if(item.type==='voucher'){s.vouchers.push(item.id);s.anteVoucherBought=true;s.shop.voucher=null;if(item.id==='overstock')s.shop.items.push(E.shopItem(s));if(item.id==='clearance'){for(const x of [...s.shop.items,...s.shop.packs])if(x.cost>0)x.cost=Math.max(1,Math.floor(x.cost*.75));}}
 s.shop.items=s.shop.items.filter(i=>i.uid!==uid);s.shop.packs=s.shop.packs.filter(i=>i.uid!==uid);
 if(item.type==='pack')E.openPack(s,item);
 return {item};
};
E.sellJoker=function(s,uid){
 if(!['play','shop','select'].includes(s.phase)||s.pack)return false;
 const j=s.jokers.find(j=>j.uid===uid);if(!j)return false;
 s.money+=E.sellValue(j);s.jokers=s.jokers.filter(j=>j.uid!==uid);return true;
};
E.openPack=function(s,offer){
 const n=offer.packType==='buffoon'?(offer.size==='normal'?2:4):(offer.size==='normal'?3:5);
 const cards=[];
 for(let i=0;i<n;i++){
  if(offer.packType==='buffoon')cards.push({type:'joker',uid:E.uid(s),joker:E.randomJoker(s)});
  if(offer.packType==='celestial')cards.push({type:'planet',uid:E.uid(s),key:E.pick(s,D.HANDS.filter(h=>D.HANDS.indexOf(h)<9||s.seenHands.includes(h.id))).id});
  if(offer.packType==='arcana')cards.push({type:'tarot',uid:E.uid(s),key:E.pick(s,D.TAROTS).id});
  if(offer.packType==='standard'){
   const enhancements=Object.keys(D.ENHANCEMENTS),c={id:E.uid(s),rank:2+Math.floor(E.random(s)*13),suit:E.pick(s,['S','H','C','D']),enhancement:E.random(s)<.4?E.pick(s,enhancements):null,edition:E.random(s)<.15?E.pick(s,['foil','holo','poly']):null,seal:E.random(s)<.2?E.pick(s,['red','gold','blue','purple']):null};
   cards.push({type:'playing',uid:E.uid(s),card:c});
  }
 }
 if(offer.packType==='celestial'&&s.vouchers.includes('telescope')){
  const key=Object.keys(s.uses).sort((a,b)=>s.uses[b]-s.uses[a])[0];cards[0].key=key;
 }
 s.pack={type:offer.packType,size:offer.size,cards,remaining:offer.size==='mega'?2:1,hand:offer.packType==='arcana'?E.shuffle(s,s.deck.map(c=>c.id)).slice(0,E.handSize(s)):[]};
 s.selected=[];
};
E.consumeInfo=function(item){
 if(item.type==='planet'){const h=D.hand(item.key);return {name:h.planet,en:h.en,color:h.color,desc:`将<b>${h.name}</b>提升 1 级<br><b class="chips">+${h.up[0]}</b> 筹码 · <b class="mult">+${h.up[1]}</b> 倍率`,select:0};}
 return D.tarot(item.key);
};
E.canUse=function(s,item,selected=s.selected||[],fromPack=false){
 if(item.type==='planet')return null;
 const t=D.tarot(item.key);if(!t)return '未知的消耗牌';
 if(t.select){
  const available=s.pack?s.pack.hand:s.phase==='play'?s.hand:[];

async function play(){
 if(busy||onTitle)return;const error=E.validatePlay(state);if(error){toast(error,'error');return;}
 hideTooltip();closeModal();initialHint=false;
 const old=E.clone(state),before=M.capture(old.hand),result=E.play(state);if(result.error){toast(result.error,'error');return;}
 const token=++actionSerial;
 busy=true;animResult=result;animHand=old.hand.filter(id=>!old.selected.includes(id));animJokers=old.jokers;displayRound=old.score;animDrawCount=old.draw.length;setMotion('play');save();
 try{
  render();setFormula(result.base.chips,result.base.mult);setMotion('play');
  await Promise.all([M.play(before,result.cards.map(c=>c.id)),M.settle(before,animHand)]);
  if(token!==actionSerial)return;
  setMotion('score');await delay(settings.motion?130:10);
  let counter=0;
  for(const step of result.steps){
   if(token!==actionSerial)return;
   const target=step.target==='card'?$('played-'+step.id):step.target==='held'?$('card-'+step.id):step.target==='joker'?$('joker-'+step.id):step.target==='blind'?$('blind-summary'):$('hand-preview');
   setFormula(step.chips,step.mult);
   if(step.kind==='chips')pulse($('chips-value'));if(['mult','xmult','balance'].includes(step.kind))pulse($('mult-value'));
   if(target){
    if(step.target==='card'){document.querySelectorAll('.played-card.scoring').forEach(el=>el.classList.remove('scoring'));target.classList.add('scoring');}
    pulse(target,step.target==='joker'?'card-trigger':'pulse');floatAt(target,step);
   }
   $('played-label').textContent=step.label;
   FX.sound(step.kind==='again'?'select':step.kind,Math.min(counter,25));counter++;
   await delay(settings.motion?(result.steps.length>35?112:step.kind==='xmult'?235:170):30);
  }
  if(token!==actionSerial)return;
  document.querySelectorAll('.played-card.scoring').forEach(el=>el.classList.remove('scoring'));
  $('played-label').textContent=D.hand(result.key).name+' \u00b7 \u8ba1\u5206\u5b8c\u6210';
  $('score-result').innerHTML='<small>\u672c\u624b\u5f97\u5206</small>'+fmt(result.total);
  pulse($('score-result'));FX.sound('score');if(settings.motion&&result.total>state.blind.target*.5)pulse($('table'),'shake');
  await delay(settings.motion?550:100);
  if(token!==actionSerial)return;
  displayRound=state.score;renderSidebar();setFormula(result.chips,result.mult);pulse($('round-score'));
  await delay(settings.motion?490:100);
  if(token!==actionSerial)return;
  setMotion('sweep');await M.discard(result.cards.map(c=>c.id),'played-','sweep');
  if(token!==actionSerial)return;
  const removed=state.phase==='play'?animHand.filter(id=>!state.hand.includes(id)):[];
  if(removed.length)await M.discard(removed);
  if(token!==actionSerial)return;
  const kept=state.hand.filter(id=>old.hand.includes(id)),positions=M.capture(kept);
  const drawn=state.phase==='play'?state.hand.filter(id=>!old.hand.includes(id)):[];
  animResult=null;animHand=null;animJokers=null;displayRound=null;render();
  if(drawn.length)await Promise.all([M.settle(positions,kept),dealHand(drawn)]);
  if(token!==actionSerial)return;
  if(state.phase==='reward'){FX.sound('win');if(settings.motion)FX.confetti();}
  else if(state.phase==='gameover')FX.sound('lose');
 }catch(err){console.error('Play animation:',err);toast('\u52a8\u753b\u5df2\u8df3\u8fc7\uff0c\u5f97\u5206\u5df2\u4fdd\u7559\u3002');}
 finally{finishMotion(token);}
}
async function discard(){
 if(busy||onTitle)return;if(state.discards<=0){toast('\u6ca1\u6709\u5269\u4f59\u5f03\u724c\u6b21\u6570','error');return;}
 if(!state.selected.length){toast('\u5148\u9009\u62e9\u8981\u5f03\u6389\u7684\u724c','error');return;}
 const token=++actionSerial,oldHand=state.hand.slice(),ids=state.hand.filter(id=>state.selected.includes(id));
 busy=true;animDrawCount=state.draw.length;hideTooltip();setMotion('discard');
 const r=E.discard(state);save();
 try{
  if(r.error){toast(r.error,'error');return;}
  await M.discard(ids);
  if(token!==actionSerial)return;
  initialHint=false;
  const kept=state.hand.filter(id=>oldHand.includes(id)),positions=M.capture(kept),drawn=state.hand.filter(id=>!oldHand.includes(id));
  render();await Promise.all([M.settle(positions,kept),dealHand(drawn)]);
 }catch(err){console.error('Discard animation:',err);toast('\u52a8\u753b\u5df2\u8df3\u8fc7\uff0c\u624b\u724c\u5df2\u66f4\u65b0\u3002');}
 finally{finishMotion(token);}
}

function jokerState(j){
 if(!j)return '';
 if(['green','bus','trousers','popcorn'].includes(j.key))return '当前提供 +'+fmt(j.value)+' 倍率';
 if(['square','icecream'].includes(j.key))return '当前提供 +'+fmt(j.value)+' 筹码';
 if(j.key==='ramen')return '当前提供 ×'+fmt(j.value)+' 倍率';
 if(j.key==='rocket')return '当前每回合获得 '+money(j.value);
 if(j.key==='egg')return '当前售价 '+money(E.sellValue(j));
 if(j.key==='bull')return '当前提供 +'+fmt(Math.max(0,state.money)*2)+' 筹码';
 if(j.key==='bootstraps')return '当前提供 +'+fmt(Math.floor(Math.max(0,state.money)/5)*2)+' 倍率';
 if(j.key==='blueprint'||j.key==='brainstorm'){
  const idx=state.jokers.findIndex(x=>x.uid===j.uid),r=E.resolvedJokers(state)[idx];
  return r?.effect?'当前复制：'+D.joker(r.effect.key).name:'当前没有可复制的目标';
 }
 return '';
}
function tipContent(key){
 const [type,id,uid]=key.split(':');
 if(type==='joker'){
  const d=D.joker(id),j=state.jokers.find(j=>j.uid===uid);
  return {title:d.name,en:d.en,body:d.desc,note:jokerState(j),rarity:d.rarity};
 }
 if(type==='card'){
  const c=E.card(state,id)||state.pack?.cards.find(x=>x.card?.id===id)?.card;
  if(!c)return {title:'卡牌',body:''};
  if(c.hidden&&state.phase==='play')return {title:'背面朝上的牌',body:'这张牌被 Boss 隐藏。<br>打出后才会揭晓牌面。',note:'可以选择、打出或弃置。'};
  let body=c.enhancement==='stone'?'<b class="chips">+50</b> 筹码':`<b class="chips">+${E.cardChips(c)}</b> 筹码`;
  if(c.enhancement)body+='<br><b>'+D.ENHANCEMENTS[c.enhancement].name+'</b><br>'+D.ENHANCEMENTS[c.enhancement].desc;
  if(c.edition)body+='<br>'+editionNames[c.edition]+(c.edition==='foil'?'：+50 筹码':c.edition==='holo'?'：+10 倍率':'：×1.5 倍率');
  if(c.seal)body+='<br>'+({red:'红色蜡封：重新触发 1 次',gold:'金色蜡封：计分时获得 $3',purple:'紫色蜡封：弃置时生成塔罗牌',blue:'蓝色蜡封：回合结束生成上次牌型的星球牌'}[c.seal]);
  return {title:cardName(c),body,note:E.isDebuffed(state,c)?'本回合失效：仍可组成牌型，但不提供筹码或能力。':''};
 }
 if(type==='planet'){const h=D.hand(id),d=E.consumeInfo({type,key:id});return {title:d.name,en:'PLANET CARD',body:d.desc,note:'当前 '+h.name+' Lv.'+state.levels[id]};}
 if(type==='tarot'){const t=D.tarot(id);return {title:t.name,en:t.en,body:t.desc,note:t.select?'先在牌桌选择手牌，再点击此牌使用。':'消耗牌 · 使用后消失'};}
 if(type==='voucher'){const v=D.VOUCHERS.find(x=>x.id===id);return {title:v.name,en:v.en,body:v.desc,note:'购买后，对当前整局游戏生效。'};}
 if(type==='tag'){const t=D.TAGS.find(x=>x.id===id);return {title:t.name,body:t.desc,note:'跳过此盲注后获得。不获得该盲注的奖金。'};}
 if(type==='pack'){return {title:packSizes[uid]+packs[id],en:'BOOSTER PACK',body:`从 ${id==='buffoon'?(uid==='normal'?2:4):(uid==='normal'?3:5)} 张牌中选择 ${uid==='mega'?2:1} 张。<br>${id==='arcana'?'立即使用塔罗牌，改造牌组。':id==='celestial'?'立即使用星球牌，升级牌型。':id==='standard'?'选择的扑克牌永久加入牌组。':'选择的小丑牌加入槽位。'}`};}
 return {title:'',body:''};
}
function showTooltip(el){
 if(busy||dragData)return;const key=el.dataset.tip;if(!key)return;let tip;
 try{tip=tipContent(key);}catch(e){return;}
 const t=$('tooltip');
 const isMobile=document.body.classList.contains('mobile-view')||matchMedia('(pointer: coarse)').matches||(innerHeight<=600&&innerWidth>innerHeight);
 t.innerHTML=`<div class="tip-title">${esc(tip.title)}</div>${tip.en?`<div class="tip-en">${esc(tip.en)}</div>`:''}<div class="tip-body">${tip.body}</div>${tip.rarity?`<span class="tip-rarity ${tip.rarity}">${rarity[tip.rarity]}</span>`:''}${tip.note?`<div class="tip-note">${tip.note}</div>`:''}${isMobile?'<div class="tip-touch-hint">轻触任意处关闭</div>':''}`;
 t.hidden=false;
 if(isMobile||settings.mobileFont!=='standard'){
  t.classList.add('mobile-tooltip');
  t.style.width='min(380px, 86vw)';
  t.style.fontSize=(settings.mobileFont==='xlarge'?18:16)+'px';
  t.querySelector('.tip-title').style.fontSize=(settings.mobileFont==='xlarge'?24:21)+'px';
 }else{
  t.classList.remove('mobile-tooltip');
  const ts=Math.max(.75,Math.min(1.2,scale));t.style.width=(260*ts)+'px';t.style.fontSize=(13*ts)+'px';
  t.querySelector('.tip-title').style.fontSize=(19*ts)+'px';
 }
 const r=el.getBoundingClientRect(),tr=t.getBoundingClientRect();let left=r.left+r.width/2-tr.width/2,top=r.top-tr.height-14;
 if(top<10)top=r.bottom+14;if(top+tr.height>innerHeight-8)top=innerHeight-tr.height-8;
 left=Math.max(8,Math.min(innerWidth-tr.width-8,left));t.style.left=left+'px';t.style.top=top+'px';
}
function hideTooltip(){clearTimeout(tooltipTimer);$('tooltip').hidden=true;}
function findShop(uid){return state.shop?.items.find(i=>i.uid===uid)||state.shop?.packs.find(i=>i.uid===uid)||(state.shop?.voucher?.uid===uid?state.shop.voucher:null);}
function performAction(action,id,el){
 if(action==='sound'){settings.sound=!settings.sound;applySettings();save();return;}
 if(busy)return;
 switch(action){
 case 'main-menu':showTitle();break;
 case 'title-new':uiDeck=hasRun?state.deckType:'red';uiSeed='';openModal('new');break;
 case 'title-continue':if(hasRun)enterTable(false);break;
 case 'title-collection':infoTab='collection';openModal('info');break;
 case 'select-card':
  if(Date.now()<dragUntil)return;
  if(E.select(state,id)){FX.sound('select');renderSidebar();renderHand();if(!state.pack)renderPhase();save();}
  else if(state.forced===id)toast('这张牌被 Boss 强制选中');
  else toast('最多可以选择 5 张牌');
  break;
 case 'play':play();break;
 case 'discard':discard();break;
 case 'sort-rank':sortAnimated('rank');break;
 case 'sort-suit':sortAnimated('suit');break;
 case 'new':uiDeck=state.deckType;uiSeed='';openModal('new');break;
 case 'pick-deck':uiSeed=$('seed-input')?.value||uiSeed;uiDeck=id;FX.sound('select');renderNew();break;
 case 'random-seed':uiSeed=randomSeed();$('seed-input').value=uiSeed;FX.sound('select');break;
 case 'begin-run':{
  const seed=$('seed-input').value.trim().toUpperCase()||randomSeed();
  state=E.newRun(uiDeck,seed);E.startBlind(state);hasRun=true;initialHint=true;closeModal();enterTable(true);break;
 }
 case 'start-blind':if(state.phase==='select'){E.startBlind(state);enterTable(true,false);}break;
 case 'skip':{const r=E.skip(state);if(r.error)toast(r.error,'error');else{render();save();toast('获得：'+D.TAGS.find(t=>t.id===r.tag).name);FX.sound('money');}break;}
 case 'cashout':if(E.cashOut(state)){FX.sound('money');render();save();if(state.phase==='victory'){FX.confetti();FX.sound('win');}}break;
 case 'next':if(state.phase==='shop'&&!state.pack){E.nextBlind(state);render();save();FX.sound('select');}break;
 case 'reroll':if(E.reroll(state)){render();save();FX.sound('deal');}else toast('金钱不足','error');break;
 case 'buy':{
  const r=E.buy(state,id);
  if(r.error)toast(r.error,'error');else{closeModal();render();save();FX.sound(r.item.type==='pack'?'deal':'buy');toast(r.item.type==='pack'?'好运，正在拆封。':'获得 '+itemName(r.item));}
  break;
 }
 case 'shop-inspect':{const item=findShop(id);if(item)openModal('preview',{item,origin:'shop'});break;}
 case 'pack-inspect':{const item=state.pack?.cards.find(c=>c.uid===id);if(item)openModal('preview',{item,origin:'pack'});break;}
 case 'take-pack':{const r=E.takePack(state,id);if(r.error){toast(r.error,'error');closeModal();}else{closeModal();render();save();toast(r.text);FX.sound('level');}break;}
 case 'skip-pack':state.pack=null;state.selected=[];closeModal();render();save();FX.sound('discard');break;
 case 'inspect-joker':openModal('inspect-joker',{uid:id});break;
 case 'inspect-consumable':openModal('inspect-consumable',{uid:id});break;
 case 'sell-joker':{if(E.sellJoker(state,id)){closeModal();render();save();FX.sound('money');toast('小丑牌已出售');}break;}
 case 'move-joker':{const idx=state.jokers.findIndex(j=>j.uid===id),next=idx+Number(el.dataset.dir);if(next>=0&&next<state.jokers.length){[state.jokers[idx],state.jokers[next]]=[state.jokers[next],state.jokers[idx]];renderInventory();renderModal();save();FX.sound('select');}break;}
 case 'sell-consumable':{const c=state.consumables.find(c=>c.uid===id);if(c){state.consumables=state.consumables.filter(x=>x.uid!==id);state.money++;closeModal();render();save();FX.sound('money');}break;}
 case 'use-consumable':{const c=state.consumables.find(c=>c.uid===id);if(c){const r=E.useConsumable(state,c);if(r.error)toast(r.error,'error');else{closeModal();render();save();toast(r.text);FX.sound('level');}}break;}
 case 'collection-inspect':openModal('preview',{item:{type:'joker',joker:{key:id}},origin:'collection'});break;
 case 'info':infoTab='hands';openModal('info');break;
 case 'deck':infoTab='deck';openModal('info');break;
 case 'info-tab':infoTab=id;FX.sound('select');renderInfo();break;
 case 'close-modal':closeModal();FX.sound('select');break;
 case 'settings':openModal('settings');break;
 case 'about':openModal('about');break;
 case 'toggle-setting':settings[id]=!settings[id];applySettings();save();renderSettings();FX.sound('select');break;
 case 'speed':settings.speed=Number(id);applySettings();save();renderSettings();FX.sound('select');break;
 case 'fullscreen':try{
 const doc=document,isFs=!!(doc.fullscreenElement||doc.webkitFullscreenElement||doc.mozFullScreenElement||doc.msFullscreenElement);
 if(isFs){
  const exit=doc.exitFullscreen||doc.webkitExitFullscreen||doc.mozCancelFullScreen||doc.msExitFullscreen;
  if(exit)exit.call(doc);
 }else{
  const el=doc.documentElement,req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
  if(req){const p=req.call(el);if(p&&p.catch)p.catch(()=>toast('无法进入全屏：需用户点击交互触发'));}
  else toast('此浏览器不支持全屏 API');
 }
}catch(e){toast('全屏切换受限');}break;
case 'fit-mode':settings.fitMode=id;fit();applySettings();save();renderSettings();FX.sound('select');break;
case 'mobile-font':settings.mobileFont=id;applySettings();save();renderSettings();FX.sound('select');break;
 case 'export-save':{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='balatro-save-'+state.seed+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('存档已导出');break;
 }
 case 'import-save':$('save-import').click();break;
 case 'endless':state.endless=true;E.openShop(state);render();save();FX.sound('level');break;
 }
}
document.addEventListener('click',e=>{
 FX.unlock();
 const el=e.target.closest('[data-action]');
 if(el&&!el.disabled){hideTooltip();performAction(el.dataset.action,el.dataset.id,el);}
 else if(e.target===$('modal-layer'))closeModal();
});
document.addEventListener('input',e=>{
 if(e.target.id==='volume-slider'){settings.volume=Number(e.target.value)/100;applySettings();save();}
 if(e.target.id==='seed-input')uiSeed=e.target.value;
});
document.addEventListener('pointerover',e=>{
 if(e.pointerType==='touch')return;
 const el=e.target.closest('[data-tip]');if(!el)return;clearTimeout(tooltipTimer);tooltipTimer=setTimeout(()=>showTooltip(el),250);
});
document.addEventListener('pointerout',e=>{
 const old=e.target.closest('[data-tip]');if(old&&!old.contains(e.relatedTarget))hideTooltip();
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){e.preventDefault();if(modal)closeModal();else if(!busy)openModal('settings');return;}
 if(e.key==='Tab'&&modal){
  const focus=[...$('modal-layer').querySelectorAll('button:not(:disabled),input')],first=focus[0],last=focus[focus.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}return;
 }
 if(e.target.matches('input,textarea')||modal||busy||e.repeat)return;
 FX.unlock();
 const key=e.key.toLowerCase();
 if(key==='f'||e.key==='F11'){e.preventDefault();performAction('fullscreen');return;}
 if(onTitle){if(e.key==='Enter'||e.code==='Space'){e.preventDefault();performAction(hasRun?'title-continue':'title-new');}return;}

 const [type,from]=dragData.split(':'),[targetType,to]=el.dataset.drag.split(':');if(type!==targetType)return;
 const arr=type==='joker'?state.jokers:(state.pack?state.pack.hand:state.hand);

 dragData=null;dragUntil=Date.now()+250;render();
});
